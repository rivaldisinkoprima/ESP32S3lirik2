[platformio]
; Menentukan direktori source kode berada di folder root (bersama dengan file .ino)
; Ini mempertahankan kompatibilitas dengan Arduino IDE
src_dir = .
include_dir = .

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino

; Kecepatan baud rate Serial Monitor sesuai dengan yang ada di kodingan
monitor_speed = 9600 

; Upload options
upload_speed = 921600

; Dependensi library yang digunakan oleh project ini
lib_deps =
   adafruit/RTClib
   dfrobot/DFRobotDFPlayerMini
   adafruit/Adafruit GFX Library
   adafruit/Adafruit ST7735 and ST7789 Library
   plerup/EspSoftwareSerial
   bblanchon/ArduinoJson

; LittleFS filesystem & partition scheme
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv  ; Perbesar ruang app + LittleFS

; Hardware config (disamakan dengan checkpsram-sample yang sudah terbukti jalan)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Build flags
build_flags =
   -DBOARD_HAS_PSRAM
   -DARDUINO_USB_CDC_ON_BOOT=1
   -DARDUINO_USB_MODE=1
   -DCORE_DEBUG_LEVEL=4
